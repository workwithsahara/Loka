name: Post story now (one-time test)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log only, don't create posts)"
        type: boolean
        default: false

jobs:
  schedule-posts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch story posts
        run: |
          for i in 1 2 3 4; do curl -fsSL -o story-365-part$i.json https://raw.githubusercontent.com/workwithsahara/laya-meta-buffer-scheduler/main/story-365-part$i.json; done
          curl -fsSL -o story-hooks-365.json https://raw.githubusercontent.com/workwithsahara/laya-meta-buffer-scheduler/main/story-hooks-365.json || echo "intro lines not found, using the old hook lines"

      - name: Run scheduler
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORG_ID: ${{ secrets.BUFFER_ORG_ID }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          ROOT_FOLDER_ID: ${{ secrets.ROOT_FOLDER_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          POST_NOW_STORY: "0"
          POST_NOW_CLEANUP_ONLY: "1"
        run: node schedule-loka-posts.js
