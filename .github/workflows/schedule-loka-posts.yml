name: Schedule Loka TikTok Posts

on:
  schedule:
    # Every 2 hours - frequent enough to keep both the 6h MAIN and 4h
    # PROMO cadences topped up without gaps.
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log only, don't create posts)"
        type: boolean
        default: false

jobs:
  schedule-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scheduler
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORG_ID: ${{ secrets.BUFFER_ORG_ID }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          ROOT_FOLDER_ID: ${{ secrets.ROOT_FOLDER_ID }}
          PROMO_ROOT_FOLDER_ID: ${{ secrets.PROMO_ROOT_FOLDER_ID }}
          PROMO_CAPTION: ${{ secrets.PROMO_CAPTION }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node schedule-loka-posts.js
